
<!doctype html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LLM Chef</title>
    <script src="https://unpkg.com/htmx.org@4.0/dist/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
  </head>

  <body>
    <div class="container">
      <h1>My GPT Chef</h1>
      <label for="result">材料</label>
      <div hx-get="/ingredients" hx-trigger="load" id="result" hx-indicator="#loading" name="result"></div>
      <form
        class="ask-form"
        hx-post="/ask"
        hx-target="#llm-result"
        hx-swap="innerHTML"
        hx-indicator="#loading"
      >
        <div id="method">
          <fieldset>
            <legend>調理方法</legend>
            <div>
              <label for="grill">焼く</label>
              <input type="radio" name="method" value="grill" id="grill">
            </div>
            <div>
              <label for="fry">炒める</label>
              <input type="radio" name="method" value="fry" id="fry">
            </div>
            <div>
              <label for="boiling">煮る</label>
              <input type="radio" name="method" value="boiling" id="boiling">
            </div>
            <div>
              <label for="none">指定しない</label>
              <input type="radio" name="method" value="none" id="none" checked>
            </div>
          </fieldset>
        </div>

        <div id="facility">
          <fieldset>
          <legend>調理器具</legend>
            <div>
              <label for="hotcook">ホットクック</label>
              <input type="radio" name="facility" value="hotcook" id="hotcook">
            </div>
            <div>
              <label for="microwave">電子レンジ</label>
              <input type="radio" name="facility" value="microwave" id="microwave">
            </div>
            <div>
              <label for="pan">フライパン</label>
              <input type="radio" name="facility" value="pan" id="pan">
            </div>
            <div>
              <label for="facility-none">指定しない</label>
              <input type="radio" name="facility" value="none" id="facility-none" checked>
            </div>
          </fieldset>
        </div>
        <button type="submit" class="ask-button">ASK</button>

      </form>

      <div id="loading" class="spinner"></div>

      <div id="llm-result"></div>
    </div>
  </body>
</html>
